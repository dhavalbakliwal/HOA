<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House of Adheera - Luxury Management Suite</title>
    
    <!-- iPhone Home Screen App Icon & Web App Settings -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adheera">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F7F5F0;
            --surface-color: #FFFFFF;
            --surface-glass: rgba(255, 255, 255, 0.88);
            --primary: #111111;
            --accent-gold: #C5A059;
            --accent-gold-light: #FBF7EC;
            --accent-purple: #5B4B8A;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --success: #00712D;
            --danger: #C93B2B;
            --warning: #B25E00;
            --shadow: 0 20px 40px -15px rgba(197, 160, 89, 0.12), 0 10px 20px -10px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 4px 16px -4px rgba(0, 0, 0, 0.04);
            --shadow-float: 0 24px 48px -12px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(197, 160, 89, 0.15);
            --border-radius: 24px;
            --card-border: 1px solid rgba(197, 160, 89, 0.18);
            --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-color: #0A0A0C;
            --surface-color: #161618;
            --surface-glass: rgba(22, 22, 24, 0.88);
            --primary: #F5F5F7;
            --accent-gold: #D4AF37;
            --accent-gold-light: #221E12;
            --accent-purple: #9D84ED;
            --text-main: #F5F5F7;
            --text-muted: #98989D;
            --success: #30D158;
            --danger: #FF453A;
            --warning: #FF9F0A;
            --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.15);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-float: 0 24px 48px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(212, 175, 55, 0.25);
            --card-border: 1px solid rgba(212, 175, 55, 0.15);
            --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        /* Hide scrollbars globally across browsers for clean app feel */
        ::-webkit-scrollbar { display: none; }
        html { -ms-overflow-style: none; scrollbar-width: none; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 120px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
            background-image: radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.04) 0%, transparent 60%);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 100vh;
            background: radial-gradient(circle at 85% 10%, rgba(197,175,55,0.06) 0%, transparent 40%),
                        radial-gradient(circle at 10% 90%, rgba(91,75,138,0.04) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding: 0 16px;
            transition: max-width 0.3s ease;
        }

        /* ========================================================
           PIN & FACE ID LOCK SCREEN OVERLAY STYLES
           ======================================================== */
        #pin-lock-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: opacity 0.4s ease;
        }
        .pin-card {
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: var(--card-border);
            border-radius: 32px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: var(--shadow-float);
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 20px 0 24px;
        }
        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background: transparent;
            transition: all 0.2s ease;
        }
        .pin-dot.filled {
            background: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }
        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .pin-key {
            background: var(--surface-color);
            border: var(--card-border);
            border-radius: 20px;
            padding: 16px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }
        .pin-key:active {
            transform: scale(0.92);
            background: rgba(197, 160, 89, 0.15);
        }
        .biometric-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--primary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .biometric-btn:active {
            transform: scale(0.96);
            background: rgba(197, 160, 89, 0.2);
        }

        /* ========================================================
           ABSOLUTE MOBILE PROTECTION & DESKTOP REDESIGN OVERRIDES
           ================================================-------- */
        @media (min-width: 1024px) {
            body {
                padding-bottom: 0;
            }
            .app-container {
                max-width: 1320px;
                margin: 0 auto;
                padding: 0 40px 60px 40px;
            }
            
            .bottom-nav {
                display: none !important;
            }

            .desktop-dock {
                display: flex !important;
                position: fixed;
                right: 28px;
                top: 50%;
                transform: translateY(-50%);
                width: 68px;
                flex-direction: column;
                align-items: center;
                padding: 16px 8px;
                background: var(--surface-glass);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-radius: 28px;
                box-shadow: var(--shadow-float);
                border: var(--card-border);
                gap: 16px;
                z-index: 1000;
            }

            .dock-item {
                position: relative;
                width: 48px;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 16px;
                color: var(--text-muted);
                cursor: pointer;
                transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                background: transparent;
                border: none;
            }

            .dock-item:hover {
                color: var(--primary);
                background: rgba(197, 160, 89, 0.08);
                transform: scale(1.05);
            }

            .dock-item.active {
                color: var(--accent-gold);
                background: rgba(197, 160, 89, 0.15);
                box-shadow: 0 4px 16px rgba(197, 160, 89, 0.25), var(--inner-glow);
            }

            .dock-item.active::before {
                content: '';
                position: absolute;
                left: -6px;
                width: 4px;
                height: 20px;
                background: var(--accent-gold);
                border-radius: 4px;
            }

            .dock-item .dock-tooltip {
                position: absolute;
                right: 64px;
                background: var(--primary);
                color: var(--bg-color);
                padding: 6px 12px;
                border-radius: 10px;
                font-size: 12px;
                font-weight: 600;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transform: translateX(8px);
                transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: var(--shadow-sm);
            }

            .dock-item:hover .dock-tooltip {
                opacity: 1;
                transform: translateX(0);
            }

            header {
                padding: 40px 0 32px;
                border-bottom: 1px solid rgba(197, 160, 89, 0.15);
                margin-bottom: 32px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title-box h1 {
                font-size: 32px;
                letter-spacing: -0.8px;
            }

            .header-title-box p.subtitle {
                font-size: 13px;
                letter-spacing: 1px;
            }

            #view-dashboard .dashboard-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 24px !important;
                margin-bottom: 32px !important;
            }

            #view-dashboard .card.full-width {
                grid-column: span 2 !important;
            }

            .quick-actions {
                max-width: 600px;
                margin-bottom: 36px;
            }

            .section-title {
                font-size: 20px;
                margin: 40px 0 20px;
            }

            #recent-transactions-list, #orders-list, #history-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .list-item, .customer-card {
                margin-bottom: 0 !important;
            }

            #view-paisa-aaya .form-group, 
            #view-paisa-gaya .form-group, 
            #view-new-order .form-group {
                max-width: 720px;
            }
            
            #view-new-order .dashboard-grid,
            #view-new-order .calc-box {
                max-width: 720px;
            }
        }

        .desktop-dock {
            display: none;
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            display: inline-block;
            vertical-align: middle;
            transition: transform 0.2s ease;
        }

        header {
            padding: 28px 4px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-title-box h1 { 
            font-size: 24px; 
            font-weight: 700; 
            color: var(--primary); 
            letter-spacing: -0.6px; 
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-title-box p.subtitle { 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 500; 
            letter-spacing: 0.3px; 
            text-transform: uppercase;
        }

        .theme-toggle-btn {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--card-border);
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
        }
        .theme-toggle-btn:active { transform: scale(0.92); }

        .view { display: none; padding: 0 0 20px; opacity: 0; transform: translateY(12px); }
        .view.active { display: block; animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: var(--card-border);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
            box-shadow: var(--shadow), var(--inner-glow);
        }
        .card:active { transform: scale(0.97); }
        .card.full-width { grid-column: span 2; }
        
        .card-title { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
        .card-amount { font-size: 26px; font-weight: 700; color: var(--primary); word-break: break-all; letter-spacing: -0.5px; }
        .card-desc { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; font-weight: 400; }

        .text-green { color: var(--success) !important; }
        .text-red { color: var(--danger) !important; }
        .text-gold { color: var(--accent-gold) !important; }
        .text-warning { color: var(--warning) !important; }

        .quick-actions { display: flex; gap: 10px; margin-bottom: 24px; }
        .btn-action {
            flex: 1;
            padding: 16px 8px;
            border-radius: 20px;
            border: var(--card-border);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm), var(--inner-glow);
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--primary);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-action:active { transform: scale(0.94); }
        .btn-action .icon-svg { width: 22px; height: 22px; }
        .btn-in .icon-svg { color: var(--success); }
        .btn-out .icon-svg { color: var(--danger); }
        .btn-dress .icon-svg { color: var(--accent-gold); }

        .reminder-box {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(197, 160, 89, 0.3);
            border-radius: var(--border-radius);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow), var(--inner-glow);
        }
        .reminder-box h3 { 
            color: var(--accent-gold); 
            margin-bottom: 12px; 
            font-size: 13px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        
        .reminder-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 4px;
        }

        .reminder-item {
            flex: 0 0 210px;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 16px;
            border-radius: 18px;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            border: var(--card-border);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
        input, select, textarea {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid rgba(197, 160, 89, 0.2);
            border-radius: 18px;
            font-size: 15px;
            font-weight: 500;
            background: var(--surface-color);
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--primary);
            box-shadow: var(--inner-glow);
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.15), var(--inner-glow); 
        }
        input[readonly] { background: rgba(0,0,0,0.03); color: var(--text-muted); }
        [data-theme="dark"] input[readonly] { background: rgba(255,255,255,0.03); }
        .amount-input { font-size: 24px; font-weight: 700; color: var(--accent-gold); letter-spacing: -0.5px; }

        .calc-pad {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow), var(--inner-glow);
            border: var(--card-border);
        }
        .calc-screen {
            width: 100%;
            background: var(--surface-color);
            border: var(--card-border);
            border-radius: 16px;
            padding: 16px;
            text-align: right;
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 16px;
            box-shadow: var(--inner-glow);
            overflow-x: auto;
            word-break: break-all;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .calc-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            background: var(--surface-color);
            border: var(--card-border);
            border-radius: 14px;
            padding: 18px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }
        .calc-btn:active { transform: scale(0.92); background: rgba(197,160,89,0.1); }
        .calc-btn.operator { color: var(--accent-gold); font-weight: 700; background: rgba(197,160,89,0.08); }
        .calc-btn.action { color: var(--danger); font-weight: 700; }
        .calc-btn.equals { background: linear-gradient(135deg, var(--accent-gold), #A47E36); color: #111111; font-weight: 700; }

        .converter-box {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow), var(--inner-glow);
            border: var(--card-border);
            margin-bottom: 20px;
        }
        .converter-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }
        .converter-row input, .converter-row select {
            padding: 14px 16px;
            font-size: 15px;
            border-radius: 14px;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .search-bar-container {
            position: relative;
            margin-bottom: 16px;
        }
        .search-bar-container input {
            padding-left: 46px;
        }
        .search-bar-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .radio-group { display: flex; gap: 10px; }
        .radio-btn {
            flex: 1;
            padding: 14px 10px;
            text-align: center;
            border: 1.5px solid rgba(197, 160, 89, 0.2);
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: var(--surface-color);
            color: var(--primary);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-sm);
        }
        .radio-btn.selected { 
            background: var(--primary); 
            color: var(--bg-color); 
            border-color: var(--primary); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
        }

        .btn-save {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, var(--accent-gold), #A47E36);
            color: #111111;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 12px 30px rgba(197,160,89,0.3);
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
            letter-spacing: 0.3px;
        }
        .btn-save:active { transform: scale(0.96); }
        
        .btn-outline {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1.5px dashed var(--accent-gold);
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }
        .btn-outline:active { background: rgba(197,160,89,0.08); }

        .section-title { font-size: 16px; font-weight: 700; margin: 28px 0 14px; color: var(--primary); letter-spacing: -0.3px; display: flex; align-items: center; justify-content: space-between; }
        
        .list-item {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm), var(--inner-glow);
            border: var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s ease;
        }
        
        .customer-card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow), var(--inner-glow);
            border: var(--card-border);
        }
